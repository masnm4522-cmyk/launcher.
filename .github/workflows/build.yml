name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          mkdir proj
          unzip -q "$(ls *.zip | head -1)" -d proj
          find proj -name DataManager.kt -delete
          F=$(find proj -name settings.gradle.kts | head -1)
          test -n "$F" || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJ_DIR=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug -p "$PROJ_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: proj/**/outputs/apk/debug/*.apk
